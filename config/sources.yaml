# Pages to watch. See README §4.
#
# mode: product  — one fixed product page; `product` must be a watchlist ID.
# mode: listing  — category / search / used page; every title goes through
#                  the matcher.
# condition: new | used | auto (detect from title/URL).
#            Defaults: new for product mode, auto for listing mode.
#
# TODO: collect the real product, category and used-section URLs per shop.

defaults:
  delay_ms: 3000        # between requests to the same host
  timeout_s: 20
  # Alert on a price drop of at least min_drop_pct percent OR min_drop_vnd.
  # Both 0: alert on every drop. (Open item: decide the threshold.)
  min_drop_pct: 0
  min_drop_vnd: 0

notify:
  # always:  email a digest every run.
  # changes: email only when there are events, plus an "all OK" heartbeat
  #          on the heartbeat weekday (Vietnam time).
  email: always
  heartbeat: sunday
  # Add a "this week vs last week" lowest-price summary to the email on
  # this weekday (Vietnam time). Remove to disable.
  weekly: sunday

sources:
  - shop: xspace
    mode: product
    product: xf10-24-ii
    url: https://fujifilm-xspace.vn/products/fujinon-xf10-24mmf4-r-ois-wr-ii

  # vjshop: robots.txt disallows /may-anh-cu and /ong-kinh-cu, so used gear
  # is watched through "Đồ cũ chất" (/do-cu-chat) only.
  - shop: vjshop
    mode: listing
    condition: used
    url: https://vjshop.vn/do-cu-chat

  - shop: vjshop
    mode: listing
    url: https://vjshop.vn/may-anh-fujifilm   # new Fujifilm bodies (page 1 of 3, 36 per page)

  - shop: vjshop
    mode: product
    product: x-t5
    url: https://vjshop.vn/fujifilm-x-t5-silver-chinh-hang

  # ── WooCommerce shops: category, search and product URLs are rewritten
  #    to the Store API (/wp-json/wc/store/v1/products) by the adapter.
  - shop: mayanhhoangto
    mode: listing
    url: https://mayanhhoangto.com/ong-kinh/ong-kinh-fuji/

  - shop: mayanhhoangto
    mode: listing
    url: https://mayanhhoangto.com/mirrorless/mirrorless-fujifirm/

  - shop: bncamera
    mode: listing
    url: https://bncamera.com/?s=fujifilm&post_type=product

  - shop: bncamera
    mode: product
    product: tamron-16-50
    url: https://bncamera.com/san-pham/tamron-16-50mm-f2-8-a-for-fujifilm-x

  - shop: x-camera
    mode: listing
    url: https://x-camera.vn/?s=fujifilm&post_type=product

  # ── kyma: category pages (its search is too picky).
  - shop: kyma
    mode: listing
    url: https://kyma.vn/may-anh-fujifilm

  - shop: kyma
    mode: listing
    url: https://kyma.vn/ong-kinh-fujifilm

  # ── zshop (CS-Cart)
  - shop: zshop
    mode: listing
    url: https://zshop.vn/may-anh-mirrorless-fujifilm/

  - shop: zshop
    mode: product
    product: x-t5
    url: https://zshop.vn/fujifilm-x-t5.html

  # ── mayanh24h: robots.txt disallows every URL with a query string.
  - shop: mayanh24h
    mode: listing
    condition: used
    url: https://mayanh24h.com/may-anh-fujifilm-cu.html

  - shop: mayanh24h
    mode: listing
    condition: used
    url: https://mayanh24h.com/ong-kinh-fujifilm-x-mount-cu.html

  - shop: mayanh24h
    mode: listing
    url: https://mayanh24h.com/may-anh-mirrorless-fujifilm.html

  - shop: mayanh24h
    mode: listing
    url: https://mayanh24h.com/ong-kinh-fujifilm-x-mount.html

  - shop: mayanh24h
    mode: product
    product: tamron-16-50
    url: https://mayanh24h.com/tamron-16-50mm-f-2-8-cho-fujifilm.html

  # ── giangduydat: a product page lists each unit (new and used) as its
  #    own offer, so it is watched as a listing.
  - shop: giangduydat
    mode: listing
    url: https://giangduydat.vn/c/ong-kinh-fujifilm

  - shop: giangduydat
    mode: listing
    url: https://giangduydat.vn/fujifilm-x-t4
