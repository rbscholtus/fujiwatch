# Pages to watch. See docs/usage.md, Configuration.
#
# mode: product  — one fixed product page; `product` must be a watchlist ID.
# mode: listing  — category / search / used page; every title goes through
#                  the matcher.
# condition: new | used | auto (detect from title/URL).
#            Defaults: new for product mode, auto for listing mode.
#

defaults:
  delay_ms: 3000        # between requests to the same host
  timeout_s: 20
  # Alert on a price drop of at least min_drop_pct percent OR min_drop_vnd.
  # Both 0: alert on every drop. (Open item: decide the threshold.)
  min_drop_pct: 0
  min_drop_vnd: 0

notify:
  # always:  email a digest every run.
  # changes: email only when there are events, plus an "all OK" heartbeat
  #          on the heartbeat weekday (Vietnam time).
  email: always
  heartbeat: sunday
  # Add a "this week vs last week" lowest-price summary to the email on
  # this weekday (Vietnam time). Remove to disable.
  weekly: sunday

