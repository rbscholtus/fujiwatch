name: watch

on:
  schedule:
    - cron: "17 23 * * *"     # 06:17 Asia/Saigon (cron is UTC); off-the-hour to avoid queue delays
  workflow_dispatch:           # manual "Run workflow" button
    inputs:
      dry_run:
        description: "Dry run (fetch and diff only; no data commit, no notifications)"
        type: boolean
        default: false
      only:
        description: "Only run the sources of this shop (empty = all)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: watch
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./...

      - name: Run
        env:
          CALLMEBOT_PHONE:  ${{ secrets.CALLMEBOT_PHONE }}
          CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
          SMTP_USER:        ${{ secrets.SMTP_USER }}
          SMTP_PASS:        ${{ secrets.SMTP_PASS }}
          MAIL_TO:          ${{ secrets.MAIL_TO }}
          DRY_RUN:          ${{ inputs.dry_run }}
          ONLY:             ${{ inputs.only }}
        run: |
          args=(run)
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          if [ -n "$ONLY" ]; then args+=(--only "$ONLY"); fi
          go run ./cmd/fujiwatch "${args[@]}"

      - name: Commit data
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -d data ]; then git add data/; fi
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "data: $(date -u +%F) [skip ci]"
          git pull --rebase
          git push

  site:
    needs: scrape
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main              # pick up the data commit

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Site data
        run: go run ./cmd/fujiwatch sitedata --out site/public/data

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Build site
        working-directory: site
        run: npm ci && npm run build

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

      - id: deploy
        uses: actions/deploy-pages@v5
